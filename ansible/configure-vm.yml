---
- name: Baseline configuration
  hosts: new_vms
  become: true
  tasks:
    - name: Apply upgrades only in an approved patch window
      ansible.builtin.apt:
        update_cache: true
        upgrade: safe
      when: approved_patch_window | default(false) | bool

    - name: Install baseline tools
      ansible.builtin.apt:
        name:
          - chrony
          - curl
          - vim
          - htop
        state: present

    - name: Ensure chrony is enabled and running
      ansible.builtin.systemd:
        name: chrony
        enabled: true
        state: started
